# cargo-packager config for Kopuz Nightly; CI fills @VERSION@ and copies the binaries to their -nightly names first.
name = "kopuz"
product-name = "Kopuz Nightly"
version = "@VERSION@"
identifier = "moe.kopuz.kopuz.nightly"
publisher = "temidaradev"
authors = ["temidaradev"]
category = "Music"
description = "A modern, lightweight music player built with Rust and GPUI, from the latest development code."
license-file = "../../LICENSE"
icons = ["../../apps/legacy/kopuz/assets/logo.png", "../../apps/legacy/kopuz/assets/app.ico"]
binaries-dir = "../../target/release"
binaries = [
  { path = "kopuz-nightly", main = true },
  { path = "kopuzd-nightly" },
  { path = "kopuzctl-nightly" },
]

[nsis]
installer-icon = "../../apps/legacy/kopuz/assets/app.ico"
template = "../kopuz/installer.nsi"
